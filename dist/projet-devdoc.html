  <noscript><h1>DevDoc — plateforme de cours et agents IA</h1><p>Une plateforme de cours où la rédaction et la révision sont assistées par des agents IA, sans jamais contourner les règles de la plateforme : les agents passent par des API authentifiées, jamais directement par la base. Plus de 15 technologies couvertes, en cours structurés, QCM et exercices. Symfony et MySQL comme source de vérité, interface Vue.js, recherche augmentée par un service Python et pgvector.</p><section><h2>Le problème</h2><p>La création et la maintenance de parcours pédagogiques demandaient beaucoup de travail manuel : structuration des menus, rédaction des cours, revue du contenu et mise à jour technique. Les agents externes devaient aussi pouvoir accéder aux cours sans contourner les règles métier de la plateforme.</p></section><section><h2>La mission</h2><p>Concevoir une architecture durable où Symfony et MySQL restent la source de vérité, tout en assistant la création et la révision des cours avec des agents MCP. La mission incluait aussi la mise à disposition d’une recherche augmentée sans exposer directement la base métier.</p></section><section><h2>La solution</h2><p>DevDoc centralise les cours dans Symfony/MySQL et expose une interface Vue.js. Les agents Node utilisent des API authentifiées, tandis qu’un service Python avec PostgreSQL/pgvector synchronise les contenus via une outbox idempotente. Cette séparation rend la génération, la publication et la recherche plus sûres et plus faciles à maintenir.</p></section><section><h2>Technologies</h2><p>symfony / vuejs</p></section></noscript></body>
