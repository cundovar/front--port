  <noscript><h1>Sites web et automatisation pour les indépendants et TPE à Paris.</h1><p>Développeur indépendant dans le 20e, je crée des sites, j’automatise vos tâches répétitives et je conçois des outils sur mesure, de l’idée à la mise en production.</p><p>Vous partez de zéro, ou vous reprenez quelque chose qui existe déjà.</p><section><h2>Vous vous reconnaissez ?</h2><h3>Vous perdez du temps dans les copier-coller et les relances</h3><p>Les mêmes actions reviennent chaque jour et mobilisent du temps sans apporter de valeur à votre activité.</p><h3>Vos informations sont dispersées entre plusieurs outils</h3><p>Vos données sont difficiles à retrouver, à suivre ou à transmettre sans manipulations manuelles.</p><h3>Votre site ou application devient difficile à modifier</h3><p>Chaque évolution prend trop de temps ou risque de fragiliser ce qui fonctionne déjà.</p><h3>Votre site fait moins sérieux que votre travail</h3><p>Il date, il s’affiche mal sur téléphone, et vous hésitez à en donner l’adresse à un client.</p><h3>Vous avez monté quelque chose avec une IA, sans oser le montrer</h3><p>Cela fonctionne quand vous l’utilisez seul, mais rien n’est sécurisé ni sauvegardé pour le mettre devant de vrais clients.</p><h3>Vous souhaitez utiliser l'IA, mais ne savez pas par où commencer</h3><p>Vous avez identifié un potentiel, mais pas encore le bon usage, les données nécessaires ou les contrôles à prévoir.</p></section><section><h2>Services</h2><h3>Gagnez du temps chaque semaine</h3><p>Automatisez les relances, copier-coller, tris et suivis qui ralentissent votre activité.</p><ul><li>Une automatisation prête à utiliser</li><li>Un tableau de suivi simple</li><li>Un historique des actions</li><li>Une formation courte pour rester autonome</li></ul><h3>Ajoutez un assistant IA utile à votre activité</h3><p>Triez, résumez, rédigez ou préparez des réponses plus rapidement, avec des contrôles humains clairs.</p><ul><li>Un premier assistant testable</li><li>Une connexion à vos données utiles</li><li>Des règles de validation humaines</li><li>Un écran pour surveiller les réponses</li></ul><h3>Remettez votre site ou application au propre</h3><p>Retrouvez un outil plus rapide, plus fiable et plus facile à faire évoluer sans repartir systématiquement de zéro.</p><ul><li>Un diagnostic clair de l'existant</li><li>Un plan de remise au propre priorisé</li><li>Une interface plus simple à utiliser</li><li>Des contenus faciles à modifier</li></ul><h3>Créez un outil adapté à votre activité</h3><p>Transformez votre façon de travailler avec une application, un espace client ou un backoffice conçu pour vos besoins.</p><ul><li>Une application ou un espace client personnalisé</li><li>Un parcours simple pour vos utilisateurs</li><li>Une connexion à vos outils existants</li><li>Une base technique propre et documentée</li></ul><h3>Transformez votre WordPress en outil professionnel</h3><p>Améliorez votre design, vos performances et vos fonctionnalités pour obtenir un site plus utile à votre activité.</p><ul><li>Un thème ou une fonctionnalité sur mesure</li><li>Des formulaires, un espace client ou la vente en ligne</li><li>Un site plus rapide et plus clair</li><li>Une formation pour gérer vos pages</li></ul></section><section><h2>Comment se déroule une mission</h2><h3>Clarifier votre besoin</h3><p>Nous échangeons sur votre situation, vos priorités et le résultat attendu.</p><h3>Valider le périmètre et le budget</h3><p>Vous recevez une proposition claire avec les fonctionnalités, le délai et le coût.</p><h3>Suivre l'avancement</h3><p>Vous découvrez régulièrement des versions testables et pouvez donner votre avis.</p><h3>Prendre en main votre solution</h3><p>Je mets le projet en ligne, documente son fonctionnement et vous forme à son utilisation.</p></section><section><h2>Ce que je fais</h2><h3>Fullstack utile</h3><p>Front, API, base de données, admin et déploiement dans une même logique produit.</p><h3>IA encadrée</h3><p>Des agents et automatisations qui assistent le travail sans masquer les contrôles humains.</p><h3>Transmission</h3><p>Une approche de formateur : livrer, expliquer et laisser une base que vous pouvez reprendre.</p></section><section><h2>À propos</h2><p>Développeur web indépendant, je conçois et je remets d’aplomb des outils qui tournent pour de vrai : sites, applications métier, automatisations. Je travaille surtout avec des indépendants et des TPE, souvent seuls face à un site qui vieillit ou à une tâche qui revient chaque semaine. Ce que je livre est documenté et administrable — vous devez pouvoir vous en servir sans moi. Je forme aussi des développeurs depuis plusieurs années : expliquer fait partie du travail.</p></section></noscript></body>
