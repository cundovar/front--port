  <noscript><h2>devdoc</h2><p>Une plateforme de cours où la rédaction et la révision sont assistées par des agents IA, sans jamais contourner les règles de la plateforme : les agents passent par des API authentifiées, jamais directement par la base. Plus de 15 technologies couvertes, en cours structurés, QCM et exercices. Symfony et MySQL comme source de vérité, interface Vue.js, recherche augmentée par un service Python et pgvector.</p><h2>WP Site Builder - Pipeline IA pour WordPress</h2><p>Un brief client entre, un site WordPress fonctionnel en sort. Huit étapes explicites — cadrage, architecture, design, contenu, intégration, contrôle, préparation, mise en ligne — chacune validée avant de passer à la suivante, et reprenable en cas d’échec. Les agents IA n’écrivent pas dans le vide : ils passent par des actions précises, contrôlées à chaque étape. React/Vite, Fastify/Mongoose, validation JSON Schema, agents reliés à n8n via MCP.</p><h2>La magicieuse</h2><p>La Magicieuse — Site e-commerce pour une maison d’édition Conception et développement complet d’une boutique en ligne headless : WordPress gère le contenu et les commandes en back-office, React affiche tout côté client sans aucun rendu PHP. Technologies : React, TypeScript, WordPress, WooCommerce, API REST, SCSS Ce que j’ai fait : - Développement du frontend React (boutique, fiches produit, panier, contact) - Création d’un plugin WordPress sur-mesure pour exposer les données via API - Intégration du feed Instagram - Système de thèmes CSS multi-ambiance</p></noscript></body>
